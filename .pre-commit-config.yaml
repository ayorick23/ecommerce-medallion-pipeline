# Hooks locales: corren las herramientas del entorno de uv (versiones fijadas en
# uv.lock), con los mismos comandos que la CI (.github/workflows/ci.yml).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]

      - id: mypy
        name: mypy (src + tests)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
