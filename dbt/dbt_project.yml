# Proyecto dbt de Gold (ADR 0026). No se corre con `dbt` directo: las rutas
# llegan por variables de entorno que definen `gold-build` y `gold-dbt`
# (ADR 0027).
name: medallion
version: "1.0.0"
profile: medallion

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Calendario fijo de dim_tiempo (ADR 0032).
  calendario_inicio: "2016-01-01"
  calendario_fin: "2020-12-31"

models:
  medallion:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +contract:
        enforced: true

seeds:
  medallion:
    +schema: seeds
