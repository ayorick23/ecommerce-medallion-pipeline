    description: >
      Una vista por tabla de Silver, sin lógica de negocio (ADR 0026). Silver ya
      trae los tipos del contrato, así que staging solo fija las columnas: si
      Silver cambia un tipo, lo detecta el contrato de los marts en lugar de un
      cast silencioso.
