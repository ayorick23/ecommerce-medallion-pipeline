[project]
name = "ecommerce-medallion-pipeline"
version = "0.1.0"
description = "Pipeline de Data Engineering para e-commerce (arquitectura medallion: Bronze/Silver/Gold) con Polars, dbt, DuckDB y Airflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandera>=0.32.1",
    "polars>=1.43.2",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
]

[project.scripts]
bronze-replay = "medallion.bronze.replay:main"

# Instalable como paquete `medallion` (src/medallion/), ADR 0016.
[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "medallion"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pandera 0.32 usa internamente un `pl.concat` que Polars 1.42 marcó como
# obsoleto; el aviso no depende de nuestro código. Revisar al actualizar Pandera.
filterwarnings = ["ignore:the default behavior of `how='horizontal'`:DeprecationWarning:pandera"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# mypy analiza el código fuente de src/medallion/ directamente (no la copia
# instalada). Sin esto no resuelve los imports entre módulos y, por
# ignore_missing_imports, los trata en silencio como Any.
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
